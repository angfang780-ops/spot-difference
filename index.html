<!doctype html>
<html lang="ko">
<head>
<title>틀린 그림 찾기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="틀린그림">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 이 게임은 다른 게임과 달리 세로 화면을 돌리지 않는다 — 세로면 두 사진을 위아래로 크게, 버튼 띠는 아래에 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible,.vh:focus-visible + label{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .btn[data-armed="1"]{background:#7A2E22;border-color:#C25A45;color:#FFE9E2}
  /* 난이도는 앱 안의 버튼으로 고른다 — 기기 기본 선택 창(select)은 돌린 화면을 따라 돌지 않는다 */
  .seg{display:flex;align-items:center;gap:6px}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stage{position:absolute;inset:0}
  #board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* 오른쪽 띠: 설정 · 찾은 개수 · 힌트 — 사진을 가리지 않게 따로 둔다 */
  .side{
    position:absolute;right:0;top:0;bottom:0;width:var(--side);display:flex;flex-direction:column;align-items:stretch;
    justify-content:space-between;gap:10px;padding:12px 10px;background:var(--bar);border-left:1px solid var(--line)
  }
  .side .btn{min-height:60px;padding:0 6px;font-size:20px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .side .btn.hint{min-height:72px;font-size:22px}
  .score{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .score b{font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:40px;line-height:1;color:var(--brass)}
  .score span{color:var(--ink-dim);font-size:15px}
  .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brass)}
  .dots i.on{background:var(--brass)}
  @media (orientation:portrait){
    .side{left:0;top:auto;width:auto;height:var(--side);flex-direction:row;align-items:center;padding:10px 14px;border-left:0;border-top:1px solid var(--line)}
    .side .btn{flex:0 0 auto;min-width:130px;padding:0 22px}
    .score{flex-direction:row;gap:12px}
  }
  .qbar{position:absolute;left:0;top:0;right:var(--side);height:66px;display:flex;align-items:center;padding:6px 16px}
  @media (orientation:portrait){ .qbar{right:0} }
  .qtxt{display:flex;align-items:center;gap:12px;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-size:32px;line-height:1;color:var(--ink)}
  .qtxt b{color:var(--brass);font-weight:400}
  .qno{padding:5px 12px;border-radius:10px;background:var(--brass);color:var(--brass-ink);font-size:24px}
  .cheer{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;
    font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-size:min(16vh,120px);line-height:1;color:var(--brass);
    -webkit-text-stroke:3px #2A1D06;text-shadow:0 8px 24px rgba(0,0,0,.6)
  }
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:19px;font-variant-numeric:tabular-nums}
  .card dt{color:var(--ink-dim)}
  .card dd{margin:0;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
  .album{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px dashed var(--line)}
  .album .note{font-size:16px}
  .album .note b{color:var(--brass)}
  .toast{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);max-width:calc(100% - 32px);
    padding:12px 18px;border-radius:12px;background:#3A1E18;border:1px solid #9C4A38;color:#FFE4DB;font-size:17px
  }
  @media (prefers-reduced-motion:no-preference){
    .btn{transition:background .15s,border-color .15s,color .15s}
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="board" role="img" aria-label="두 사진에서 다른 곳 찾기"></canvas>
    <!-- 위쪽 띠: 문제 번호 · 찾을 개수 (시간 제한은 두지 않는다 — 어르신이 쓰셔서) -->
    <div class="qbar" id="qbar">
      <div class="qtxt"><span class="qno" id="qNo">1 / 5</span>다른 곳 <b id="qN">3</b>군데를 찾아보세요</div>
    </div>
    <div class="cheer" id="cheer" hidden></div>
    <aside class="side" id="side">
      <button id="gear" class="btn" type="button">설정</button>
      <div class="score"><span>찾은 곳</span><b id="score">0/0</b><div class="dots" id="dots"></div></div>
      <button id="hint" class="btn hint" type="button">힌트</button>
    </aside>
    <div class="toast" id="toast" hidden></div>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <input id="file" class="vh" type="file" accept="image/*">
          <div id="mode" class="seg wide" role="group" aria-label="무엇으로 할까요">
            <button class="btn" type="button" data-v="art" aria-pressed="true">동화 그림</button>
            <button class="btn" type="button" data-v="illust" aria-pressed="false">일러스트</button>
            <button class="btn" type="button" data-v="photo" aria-pressed="false">내 사진</button>
          </div>
          <p class="note wide">일러스트: 무료 일러스트(만화풍 그림)를 「폴더 고르기」로 넣으면 머리 색·단추처럼 색 덩어리를 바꿔 문제를 만들어요.</p>
          <label for="file" class="btn wide">그림·사진 한 장 고르기</label>
          <input id="dir" class="vh" type="file" webkitdirectory multiple>
          <label for="dir" class="btn wide" id="dirLbl">폴더 고르기</label>
          <div class="album wide" id="album" hidden>
            <p class="note">사진 묶음 <b id="albumN">0</b>장 · 다 찾으면 이 중에서 다른 사진이 나와요 (사진 퍼즐·숨은그림에 넣은 사진도 함께 써요)</p>
            <div class="grid2">
              <button id="next" class="btn" type="button">다른 사진으로</button>
              <button id="albumClear" class="btn" type="button">묶음 비우기</button>
            </div>
          </div>
          <div id="level" class="seg wide" role="group" aria-label="난이도">
            <button class="btn" type="button" data-v="1" aria-pressed="true">쉬움 3곳</button>
            <button class="btn" type="button" data-v="2" aria-pressed="false">보통 5곳</button>
            <button class="btn" type="button" data-v="3" aria-pressed="false">어려움 7곳</button>
          </div>
          <button id="again" class="btn" type="button">새로 바꾸기</button>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="full" class="btn wide" type="button">전체 화면</button>
        </div>
        <p class="note" id="stat">시간 <b id="tm">0:00</b> · 왼쪽과 오른쪽 사진에서 다른 곳을 눌러요 · 「힌트」는 여러 번 누를수록 더 정확히 알려 줘요</p>
        <p class="note">버전 11월 4일 · 5문제 · 일러스트</p>
        <button id="menuClose" class="btn primary" type="button">닫고 찾기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2 id="dTitle">다 찾았어요!</h2>
        <dl>
          <dt>다 찾은 문제</dt><dd id="dPc">0</dd>
          <dt>걸린 시간</dt><dd id="dTm">0:00</dd>
        </dl>
        <button id="doneNext" class="btn primary" type="button" hidden>다른 사진으로</button>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
        <button id="doneClose" class="btn" type="button">그림 보기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#board'), ctx = cv.getContext('2d');
  const stage = $('#stage'), side = $('#side');
  const turned = matchMedia('(orientation: portrait)');
  const KEY = 'diff.v1', ALBUM = 'diff.album', MODE = 'diff.mode', AUTO_SEC = 10, DONE_DELAY = 1, HINT_MS = 5000;
  let mode = 'art'; // 'art' 동화 그림(기본) / 'illust' 일러스트 / 'photo' 내 사진 — boot에서 저장값을 읽는다

  // 난이도: 바꿀 곳 수, 크기(사진 짧은 변 대비)
  const LEVELS = { 1: { n: 3, size: .12 }, 2: { n: 5, size: .095 }, 3: { n: 7, size: .075 } };
  // 바꾸는 방식: 색이 뚜렷한 부분만 색 바꾸기, 물건 지우기, 크게 하기, 좌우 뒤집기, 옆 무늬 하나 더 (가장자리는 모두 부드럽게)
  const KINDS = ['recolor', 'erase', 'grow', 'mirror', 'dup'];
  // 예전 방식(그림 넣기)으로 저장된 판을 이어 할 때 쓰는 모양 (100×100 칸)
  const SHAPES = [
    'M50 86C20 62 8 45 14 30C20 15 42 14 50 30C58 14 80 15 86 30C92 45 80 62 50 86Z',
    'M50 8L61 38H93L67 57L77 88L50 69L23 88L33 57L7 38H39Z',
    'M50 12L90 46H78V88H22V46H10Z',
    'M10 52A40 40 0 0 1 90 52Z M48 52H52V82A8 8 0 0 1 36 82H40A4 4 0 0 0 48 82Z',
    'M18 50Q45 20 72 50Q45 80 18 50Z M68 50L92 30L86 50L92 70Z',
    'M50 50m-36 0a36 36 0 1 0 72 0a36 36 0 1 0 -72 0Z'
  ].map(d => new Path2D(d));
  const COLORS = ['#E5432F', '#F2C230', '#2F7FE5', '#FFFFFF', '#7B3FB8', '#2FA35B'];

  let W = 0, H = 0, dpr = 1, S = 1, AX = 0, AY = 0, BX = 0, BY = 0;
  let G = null, dirty = true, felt = null, showDone = true, soundOn = true;
  let fx = [];

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
  };
  const rnd = (a,b) => a + Math.random()*(b-a);
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- 다른 곳 만들기 ----------
  // 무늬가 있는 곳(밝기 흩어짐이 큰 곳)을 고른다 — 하늘처럼 밋밋한 곳은 바꿔도 티가 안 나거나 너무 티가 난다
  function busyMap(base){
    const gw = 96, gh = Math.max(1, Math.round(96*base.height/base.width));
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(base, 0, 0, gw, gh);
    const px = g.getImageData(0, 0, gw, gh).data, lum = new Float32Array(gw*gh), sat = new Float32Array(gw*gh);
    for (let i = 0; i < lum.length; i++){
      const r = px[i*4], gg = px[i*4+1], b = px[i*4+2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
      lum[i] = .299*r + .587*gg + .114*b;
      sat[i] = mx ? (mx - mn)/mx : 0;
    }
    const k = gw/base.width;
    return (x, y, r) => {
      const x0 = Math.max(0, Math.floor((x - r)*k)), x1 = Math.min(gw-1, Math.ceil((x + r)*k));
      const y0 = Math.max(0, Math.floor((y - r)*k)), y1 = Math.min(gh-1, Math.ceil((y + r)*k));
      let n = 0, sum = 0, sq = 0, colorful = 0;
      for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++){
        const i = yy*gw + xx, v = lum[i]; n++; sum += v; sq += v*v; if (sat[i] > .3 && v > 35 && v < 235) colorful++;
      }
      const m = sum/n;
      return { sd: Math.sqrt(Math.max(0, sq/n - m*m)), mean: m, colorful: colorful/n };
    };
  }
  function plan(base, level){
    const L = LEVELS[level], w = base.width, h = base.height, short = Math.min(w, h), busy = busyMap(base);
    // 쉬움에서만 밝기 바꾸기를 섞는다 (가장 티가 나는 방식)
    const pool = shuffle(level === 1 ? KINDS.concat('bright') : KINDS.slice());
    const out = [];
    for (let i = 0; i < L.n; i++){
      let best = null, bestScore = -Infinity;
      for (let t = 0; t < 300; t++){
        const r = short*L.size*rnd(.9, 1.15), m = r*1.4;
        const d = { x: rnd(m, w-m), y: rnd(m, h-m), r };
        const gap = Math.min(Infinity, ...out.map(q => Math.hypot(q.x-d.x, q.y-d.y) - (q.r+d.r)*1.3));
        if (gap <= 0) continue;
        const b = busy(d.x, d.y, r);
        const score = Math.min(b.sd, 40) + Math.min(gap/short, .15)*30 + b.colorful*15;
        if (score > bestScore){ best = { ...d, b }; bestScore = score; }
      }
      if (!best) continue;
      // 색이 뚜렷한 곳은 색 바꾸기를 먼저, 색이 없는 곳에서는 색 바꾸기를 빼고 다음 방식
      let kind = pool[i % pool.length];
      if (best.b.colorful > .25 && !out.some(o => o.k === 'recolor')) kind = 'recolor';
      else if (kind === 'recolor' && best.b.colorful < .12) kind = pool.find(k => k !== 'recolor' && !out.some(o => o.k === k)) || 'dup';
      out.push({
        x: +best.x.toFixed(1), y: +best.y.toFixed(1), r: +best.r.toFixed(1), k: kind,
        p: kind === 'recolor' ? Math.round(rnd(120, 240)) : kind === 'bright' ? (best.b.mean > 120 ? .55 : 1.6)
         : kind === 'dup' ? +rnd(0, Math.PI*2).toFixed(3) : kind === 'erase' ? +eraseFrom(base, best).toFixed(3) : 0,
        f: 0
      });
    }
    return out;
  }
  // 지우기에 쓸 옆자리: 둘레 색이 지울 곳의 둘레와 가장 비슷한 방향
  let pxCache = null;
  function eraseFrom(base, d){
    if (!pxCache || pxCache.base !== base){
      const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
      const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(base, 0, 0);
      pxCache = { base, data: g.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height };
    }
    const { data, w, h } = pxCache, s = d.r*2.2, N = 32;
    const px = (x, y) => { const i = (Math.max(0, Math.min(h-1, Math.round(y)))*w + Math.max(0, Math.min(w-1, Math.round(x))))*4; return [data[i], data[i+1], data[i+2]]; };
    const ring = (cx, cy) => { const out = []; for (let i = 0; i < N; i++){ const a = i/N*Math.PI*2; out.push(px(cx + Math.cos(a)*d.r*1.02, cy + Math.sin(a)*d.r*1.02)); } return out; };
    const target = ring(d.x, d.y);
    let best = 0, bestErr = Infinity;
    for (let i = 0; i < 16; i++){
      const a = i/16*Math.PI*2, sx = d.x + Math.cos(a)*s, sy = d.y + Math.sin(a)*s;
      if (sx < d.r || sy < d.r || sx > w - d.r || sy > h - d.r) continue;
      const r2 = ring(sx, sy);
      let err = 0;
      for (let j = 0; j < N; j++) for (let ch = 0; ch < 3; ch++) err += Math.abs(r2[j][ch] - target[j][ch]);
      if (err < bestErr){ bestErr = err; best = a; }
    }
    // 그릴 때 사진을 (−cos, −sin)만큼 옮겨 그리므로, 이 방향(+cos, +sin)의 무늬가 이 자리에 온다
    return best;
  }

  // 한 곳을 바꿔 그린 조각을 만들고, 가장자리를 서서히 흐리게 해서 원래 사진에 섞어 붙인다
  function patch(g, base, d, draw, inner){
    const R = Math.ceil(d.r), size = 2*R;
    const t = document.createElement('canvas'); t.width = t.height = size;
    const tg = t.getContext('2d', { willReadFrequently: true });
    tg.translate(R - d.x, R - d.y);
    draw(tg, t);
    tg.setTransform(1, 0, 0, 1, 0, 0);
    tg.globalCompositeOperation = 'destination-in';
    const gr = tg.createRadialGradient(R, R, 0, R, R, R);
    gr.addColorStop(0, '#000'); gr.addColorStop(inner, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    tg.fillStyle = gr; tg.fillRect(0, 0, size, size);
    g.drawImage(t, d.x - R, d.y - R);
  }
  function rgb2hsl(r, g, b){
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn)/2;

        g.fillStyle = o.c; P([[0, -.5], [.28, -.1], [0, .25], [-.28, -.1]]); g.fill(); outline(g, lw*.7);

  function renderScene(theme, objs){
    const T = THEMES[theme], c = document.createElement('canvas'); c.width = AW; c.height = AH;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, AH*.6); gr.addColorStop(0, T.sky[0]); gr.addColorStop(1, T.sky[1]);
    g.fillStyle = gr; g.fillRect(0, 0, AW, AH);
    if (T.hills){ g.fillStyle = T.hills; for (const [x, r] of [[250, 330], [800, 420], [1300, 300]]){ g.beginPath(); g.ellipse(x, AH*T.bands[0][0] + 20, r, r*.42, 0, Math.PI, 0); g.fill(); } }
    for (const [y, col] of T.bands){ g.fillStyle = col; g.fillRect(0, AH*y, AW, AH); }
    // 하늘 물건 → 땅 물건 (아래 있는 것이 앞에)
    const sky = ['sun', 'moon', 'star', 'cloud', 'bird', 'kite', 'balloon'];
    const list = objs.slice().sort((a, b) => (sky.includes(b.t) - sky.includes(a.t)) || (a.y + objBox(a)[1]/2) - (b.y + objBox(b)[1]/2));
    for (const o of list){ if (theme === 'night' && o.t === 'house') o.night = 1; drawObj(g, o); }
    return c;
  }
  function buildArt(level, saved){
    let art, diffs;
    if (saved){ art = saved.art; diffs = saved.diffs; }
    else { const sc = makeScene(), d = makeDiffs(sc, level); art = { theme: sc.theme, objs: sc.objs, objs2: d.objs2 }; diffs = d.diffs; }
    const base = renderScene(art.theme, art.objs), changed = renderScene(art.theme, art.objs2);
    G = { base, changed, art, sample: false, dataURL: null, level, diffs, hintD: null,
          elapsed: saved ? saved.el || 0 : 0, done: !!(saved && saved.done), started: false };
    fx = [];
    startProblem();
    $('#done').hidden = true; $('#menu').hidden = true;
    stopAuto();
    layout(); showDone = true; syncUI(); save();
  }

  // ---------- 일러스트: 색 덩어리 단위로 바꾸기 ----------
  // 일러스트는 색이 칸칸이 나뉘어 있어서, 비슷한 색끼리 이어진 덩어리(머리카락·넥타이·단추·꽃 등)를 통째로
  // 다른 색으로 칠하거나 둘레 색으로 지운다 — 경계가 또렷해서 영상 속 틀린그림처럼 자연스럽다
  function regionDiffs(base, level){
    const w = base.width, h = base.height, N = w*h;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(base, 0, 0);
    const im = g.getImageData(0, 0, w, h), px = im.data, src = new Uint8ClampedArray(px);
    const lum = i => .299*src[i*4] + .587*src[i*4+1] + .114*src[i*4+2];
    // 1) 씨앗 색과 비슷한 색끼리 이어진 덩어리
    const lab = new Int32Array(N).fill(-1), stack = new Int32Array(N), regs = [], TOL = 34*34;
    for (let s = 0; s < N; s++){
      if (lab[s] >= 0) continue;
      const id = regs.length, r0 = src[s*4], g0 = src[s*4+1], b0 = src[s*4+2];
      let sp = 0, n = 0, sx = 0, sy = 0, x0 = w, y0 = h, x1 = 0, y1 = 0, border = false, sr = 0, sg = 0, sb = 0;
      stack[sp++] = s; lab[s] = id;
      while (sp){
        const q = stack[--sp], x = q % w, y = (q - x)/w;
        n++; sx += x; sy += y; sr += src[q*4]; sg += src[q*4+1]; sb += src[q*4+2];
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x === 0 || y === 0 || x === w-1 || y === h-1) border = true;
        for (const nq of [x > 0 ? q-1 : -1, x < w-1 ? q+1 : -1, y > 0 ? q-w : -1, y < h-1 ? q+w : -1]){
          if (nq < 0 || lab[nq] >= 0) continue;
          const dr = src[nq*4] - r0, dg = src[nq*4+1] - g0, db = src[nq*4+2] - b0;
          if (dr*dr + dg*dg + db*db < TOL){ lab[nq] = id; stack[sp++] = nq; }
        }
      }
      regs.push({ id, n, cx: sx/n, cy: sy/n, x0, y0, x1, y1, border, r: sr/n, g: sg/n, b: sb/n });
    }
    // 2) 고를 만한 덩어리: 테두리에 안 닿고, 검은 선이 아니고, 너무 크지 않은 것 (모자라면 작은 것까지)
    const L = LEVELS[level], maxA = N*(level === 1 ? .05 : .03);
    const sat = r => { const mx = Math.max(r.r, r.g, r.b), mn = Math.min(r.r, r.g, r.b); return mx ? (mx - mn)/mx : 0; };
    // 살색(얼굴·손)은 색을 바꾸거나 지우면 이상해 보여서 뺀다
    const skin = r => r.r > 170 && r.g > 110 && r.b > 80 && r.r > r.g && r.g > r.b && r.r - r.b < 130 && sat(r) < .5;
    let cands = [];
    for (const f of (level === 1 ? [.003, .0012, .0005] : [.0012, .0005, .0002])){
      cands = regs.filter(r => !r.border && r.n >= N*f && r.n <= maxA && (.299*r.r + .587*r.g + .114*r.b) > 45
        && r.n/((r.x1 - r.x0 + 1)*(r.y1 - r.y0 + 1)) > .22 && !skin(r));
      if (cands.length >= L.n*2) break;
    }
    shuffle(cands);
    // 쉬울수록 큰 덩어리부터
    if (level === 1) cands.sort((a, b) => b.n - a.n);
    // 3) 바꾸기 — 색 바꾸기와 지우기를 번갈아 (색이 흐린 덩어리는 지우기만, 큰 덩어리는 색 바꾸기만)
    const VIVID = [[229,57,53],[30,136,229],[67,160,71],[251,140,0],[142,68,173],[253,216,53],[240,98,146]];
    const diffs = [], picked = [];
    for (const r of cands){
      if (diffs.length >= L.n) break;
      const rad = Math.max(r.x1 - r.x0, r.y1 - r.y0)/2;
      if (picked.some(p => Math.hypot(p.cx - r.cx, p.cy - r.cy) < p.rad + rad + 24)) continue;
      const canRecolor = sat(r) > .25, canErase = r.n <= N*.02;
      let op = diffs.length % 2 === 0 ? 'recolor' : 'erase';
      if (op === 'recolor' && !canRecolor) op = canErase ? 'erase' : null;
      else if (op === 'erase' && !canErase) op = canRecolor ? 'recolor' : null;
      if (!op) continue;
      const mine = [];
      for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++){ const i = y*w + x; if (lab[i] === r.id) mine.push(i); }
      if (op === 'recolor'){
        // 그 덩어리 평균색에서 멀리 떨어진 선명한 색으로, 그림자 진하기는 그대로 살려서
        const far = VIVID.map(v => ({ v, d: (v[0]-r.r)**2 + (v[1]-r.g)**2 + (v[2]-r.b)**2 })).sort((a, b) => b.d - a.d)[Math.floor(Math.random()*3)].v;
        for (const i of mine){ const p = i*4; px[p] = Math.max(0, Math.min(255, far[0] + src[p] - r.r)); px[p+1] = Math.max(0, Math.min(255, far[1] + src[p+1] - r.g)); px[p+2] = Math.max(0, Math.min(255, far[2] + src[p+2] - r.b)); }
      } else {
        // 지우기: 굵은 검은 테두리 너머 둘레에서 가장 많은 색으로, 덩어리와 그 테두리 선까지 덮는다
        const cnt = new Map(), D = 11, inR = new Set(mine), dark = new Set();
        for (const i of mine){
          const x = i % w, y = (i - x)/w;
          for (let dy = -D; dy <= D; dy++) for (let dx = -D; dx <= D; dx++){
            const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
            const j = yy*w + xx; if (inR.has(j)) continue;
            if (Math.abs(dx) <= 8 && Math.abs(dy) <= 8) dark.add(j); // 테두리 후보 (아래에서 바탕보다 어두운 것만 덮음)
            if (lum(j) < 90) continue;
            if (Math.abs(dx) < 7 && Math.abs(dy) < 7) continue; // 테두리 바로 옆 번진 색은 빼고
            const key = (src[j*4] >> 4) + ',' + (src[j*4+1] >> 4) + ',' + (src[j*4+2] >> 4);
            const e = cnt.get(key) || [0, 0, 0, 0]; e[0]++; e[1] += src[j*4]; e[2] += src[j*4+1]; e[3] += src[j*4+2]; cnt.set(key, e);
          }
        }
        let best = null; for (const e of cnt.values()) if (!best || e[0] > best[0]) best = e;
        if (!best) continue;
        const fr = best[1]/best[0], fg = best[2]/best[0], fb = best[3]/best[0], fl = .299*fr + .587*fg + .114*fb;
        for (const i of mine){ const p = i*4; px[p] = fr; px[p+1] = fg; px[p+2] = fb; }
        // 테두리 선과 그 번진 자국: 둘레 바탕색보다 어두운 것만 덮는다 (이웃 그림은 그대로)
        for (const i of dark) if (lum(i) < fl - 25){ const p = i*4; px[p] = fr; px[p+1] = fg; px[p+2] = fb; }
      }
      picked.push({ ...r, rad });
      diffs.push({ x: Math.round(r.cx), y: Math.round(r.cy), r: Math.round(Math.max(30, r.rad*1.2)), k: op, f: 0 });
    }
    g.putImageData(im, 0, 0);
    return { diffs, changed: c };
  }

  // ---------- 게임 ----------
  // kind: 'illust'이면 일러스트 방식(색 덩어리), 아니면 사진 방식 / chgImg: 이어하기 때 저장해 둔 바뀐 그림
  function build(base, level, sample, dataURL, saved, kind, chgImg){
    let diffs, changed;
    if (kind === 'illust'){
      if (saved && chgImg){ diffs = saved.diffs; changed = chgImg; }
      else ({ diffs, changed } = regionDiffs(base, level));
      if (!diffs.length){ toast('이 그림에서는 다른 곳을 만들기 어려워요. 다른 그림으로 해 볼게요.'); }
    } else { diffs = saved ? saved.diffs : plan(base, level); changed = paint(base, diffs); }
    G = { base, sample, dataURL, level, diffs, changed, illust: kind === 'illust', hintD: null,
          elapsed: saved ? saved.el || 0 : 0, done: !!(saved && saved.done), started: false };
    if (G.illust){ try { G.chgURL = changed.toDataURL('image/jpeg', .9); } catch(e){} }
    fx = [];
    startProblem();
    layout();
    showDone = true;
    syncUI();
    save();
  }
  function newGame(img, level, sample, dataURL, kind){
    if (!sample && !dataURL){ try { dataURL = img.toDataURL('image/jpeg', .85); } catch(e){ dataURL = null; } }
    build(img, level, sample, dataURL, null, kind);
    $('#menu').hidden = true;
  }
  const kindNow = () => mode === 'illust' ? 'illust' : undefined;
  const level = () => { const b = $('#level [aria-pressed="true"]'); return b ? +b.dataset.v : 1; };
  function syncLevel(v){ for (const b of $('#level').querySelectorAll('[data-v]')) b.setAttribute('aria-pressed', +b.dataset.v === v ? 'true' : 'false'); }
  const foundN = () => G.diffs.filter(d => d.f).length;

  // ---------- 한 판 = 5문제 (영상처럼: 위에 문제 번호·남은 시간, 다 풀면 결과) ----------
  const ROUND_N = 5;
  let RD = { at: 1, full: 0, time: 0 }, between = false;
  function startProblem(){
    between = false;
    $('#cheer').hidden = true;
    syncBar();
  }
  function syncBar(){
    if (!G) return;
    $('#qNo').textContent = `${RD.at} / ${ROUND_N}`;
    $('#qN').textContent = G.diffs.length;
  }
  function cheer(text, ms){
    const c = $('#cheer'); c.textContent = text; c.hidden = false;
    setTimeout(() => { c.hidden = true; }, ms);
  }
  function finish(){
    G.done = true; G.started = false; showDone = false;
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110));
    RD.full++; RD.time += G.elapsed;
    syncUI();
    cheer('찾았어요!', 1500);
    toNext(1700);
  }
  function toNext(ms){
    between = true;
    const cur = G;
    setTimeout(() => {
      if (G !== cur) return;
      if (RD.at >= ROUND_N) return showResult();
      RD.at++;
      nextProblem();
    }, ms);
  }
  function nextProblem(){
    if (mode === 'art') return buildArt(level());
    if (album.length) return nextPhoto();
    if (mode === 'illust'){ setMode('art'); return buildArt(level()); }
    newGame(sampleImage(), level(), true);
  }
  function showResult(){
    $('#dTitle').textContent = RD.full === ROUND_N ? '다 찾았어요!' : '잘하셨어요!';
    $('#dPc').textContent = `${ROUND_N}문제 중 ${RD.full}문제`;
    $('#dTm').textContent = fmt(RD.time);
    $('#doneNext').hidden = true; $('#doneClose').hidden = true; $('#doneAgain').hidden = false;
    $('#doneAgain').textContent = '한 판 더';
    $('#done').hidden = false;
  }
  function newRound(){
    RD = { at: 1, full: 0, time: 0 };
    $('#done').hidden = true;
    nextProblem();
  }
  function openDone(){
    if (!G || !G.done || showDone) return;
    showDone = true; syncUI();

      album = files.slice(first); curKey = album[0]; bag = album.slice(1);
      syncAlbum(); saveAlbum();
      toast(`사진 ${album.length}장으로 묶음을 만들었어요. (앱을 닫으면 묶음은 잊어요)`);
      return;
    }
    album = []; bag = []; curKey = 0;
    let key = 0;
    for (let i = first; i < files.length; i++){
      try {
        const c = i === first ? firstImg : await loadFit(files[i]);
        const blob = await toJpeg(c);
        if (job !== importJob) return;
        const k = key++;
        await idb('readwrite', st => st.put(blob, k));
        if (job !== importJob) return;
        album.push(k); if (k !== curKey) bag.push(k);
      } catch(e){ if (job !== importJob) return; }
      if (album.length % 10 === 0){ syncAlbum(); saveAlbum(); if (files.length - first > 10) toast(`사진 묶음 정리 중… ${album.length}/${files.length - first}`); }
    }
    syncAlbum(); saveAlbum();
    toast(`사진 ${album.length}장으로 묶음을 만들었어요. 다 찾으면 다른 사진이 나와요.`);
  }
  let nexting = false;
  async function nextPhoto(){
    stopAuto();
    if (mode === 'art'){ buildArt(level()); return; }
    if (!album.length || nexting) return;
    nexting = true;
    try {
      for (let tries = 0; tries < 6 && album.length; tries++){
        if (!bag.length) bag = album.filter(k => k !== curKey);
        if (!bag.length) bag = album.slice();
        const k = bag.splice(Math.floor(Math.random()*bag.length), 1)[0];
        try {
          const blob = isNum(k) ? await photoBlob(k) : k;
          if (!blob) throw new Error('missing');
          const img = await loadFit(blob);
          curKey = k; saveAlbum();
          $('#done').hidden = true;
          newGame(img, level(), false, null, kindNow());
          return;
        } catch(e){ album = album.filter(x => x !== k); syncAlbum(); saveAlbum(); }
      }
      toast('다음 사진을 열지 못했어요. 사진을 다시 골라 주세요.');
    } finally { nexting = false; }
  }
  function clearAlbum(){
    // 빌려 쓴 사진을 비웠으면 다음에 열 때 다시 빌려 오지 않는다 (다른 앱의 사진은 지우지 않음)
    if (album.some(k => typeof k === 'string')) store.set(BORROW_OFF, '1');
    importJob++; album = []; bag = []; curKey = null;
    idb('readwrite', st => st.clear()).catch(() => {});
    stopAuto(); syncAlbum(); saveAlbum();
  }
  let autoT = 0, autoN = 0;
  const nextLabel = () => mode === 'art' ? '다른 그림으로' : '다른 사진으로';
  function stopAuto(){ clearInterval(autoT); autoT = 0; $('#doneNext').textContent = nextLabel(); }
  function startAuto(){
    stopAuto(); autoN = AUTO_SEC;
    const b = $('#doneNext'), show = () => { b.textContent = `${nextLabel()} (${autoN})`; };
    show();
    autoT = setInterval(() => { if (document.hidden) return; if (--autoN <= 0) nextPhoto(); else show(); }, 1000);
  }

  // ---------- UI ----------
  const fmt = ms => {
    const t = Math.floor(ms/1000), hh = Math.floor(t/3600), mm = Math.floor(t/60) % 60, ss = String(t % 60).padStart(2, '0');
    return hh ? `${hh}:${String(mm).padStart(2,'0')}:${ss}` : `${mm}:${ss}`;
  };
  function syncStats(){
    if (!G) return;
    const n = foundN();
    $('#tm').textContent = fmt(G.elapsed);
    $('#score').textContent = `${n}/${G.diffs.length}`;
    const dots = $('#dots');
    if (dots.children.length !== G.diffs.length){ dots.textContent = ''; G.diffs.forEach(() => dots.appendChild(document.createElement('i'))); }
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i < n));
  }
  function syncUI(){
    syncLevel(G.level);
    $('#done').hidden = !(G.done && showDone);
    $('#hint').hidden = G.done;
    $('#dTm').textContent = fmt(G.elapsed);
    $('#dPc').textContent = `${G.diffs.length}곳`;
    syncStats(); dirty = true;
  }
  let toastT = 0;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200);
  }
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');

  $('#file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); saveWarned = false; if (mode !== 'illust') setMode('photo'); newGame(fit(im, 1400), level(), false, null, kindNow()); };
    im.onerror = () => { URL.revokeObjectURL(url); toast('이 파일은 열 수 없어요. 사진(JPG·PNG) 파일을 골라 주세요.'); };
    im.src = url;
  });
  $('#dir').addEventListener('change', e => {
    const fs = e.target.files ? [...e.target.files] : [];
    e.target.value = '';
    if (fs.length){ if (mode !== 'illust') setMode('photo'); useAlbum(fs); }
  });
  $('#mode').addEventListener('click', async e => {
    const b = e.target.closest('[data-v]');
    if (!b || b.dataset.v === mode) return;
    setMode(b.dataset.v);
    if (mode === 'art'){ buildArt(level()); return; }
    if (mode === 'illust'){ if (album.length) nextPhoto(); else { toast('「폴더 고르기」로 일러스트 그림을 넣어 주세요. 그동안은 동화 그림으로 해요.'); } return; }
    // 내 사진: 묶음이 있으면 그 사진, 없으면 다른 게임 사진을 빌리고, 그것도 없으면 사진을 골라 달라고
    if (album.length){ nextPhoto(); return; }
    if (!(await tryBorrow())){ newGame(sampleImage(), level(), true); toast('「사진 한 장 고르기」나 「폴더 고르기」로 사진을 넣어 주세요.'); }
  });
  // 아이폰·아이패드는 폴더 고르기가 안 돼서 같은 버튼이 여러 장 고르기가 된다
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!('webkitdirectory' in $('#dir')) || iOS){
    const d = $('#dir'); d.removeAttribute('webkitdirectory'); d.accept = 'image/*';
    $('#dirLbl').textContent = '사진 여러 장 고르기';
  }
  $('#next').addEventListener('click', nextPhoto);
  $('#doneNext').addEventListener('click', nextPhoto);
  const clr = $('#albumClear');
  let clrT = 0;
  clr.addEventListener('click', () => {
    if (clr.dataset.armed !== '1'){
      clr.dataset.armed = '1'; clr.textContent = '한 번 더 누르면 비워요';
      clearTimeout(clrT); clrT = setTimeout(() => { clr.dataset.armed = '0'; clr.textContent = '묶음 비우기'; }, 2600);
      return;
    }
    clearTimeout(clrT); clr.dataset.armed = '0'; clr.textContent = '묶음 비우기';
    clearAlbum();
  });
  $('#level').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || !G || +b.dataset.v === G.level) return;
    syncLevel(+b.dataset.v);
    if (G.art) buildArt(+b.dataset.v);
    else newGame(G.base, +b.dataset.v, G.sample, G.dataURL, G.illust ? 'illust' : undefined);
  });
  $('#hint').addEventListener('click', hint);
  $('#sound').addEventListener('click', e => { soundOn = !soundOn; toggle(e.currentTarget, soundOn); if (soundOn){ wakeAudio(); beep(660, .08); } });
  const again = $('#again');
  let armT = 0;
  const disarm = () => { again.dataset.armed = '0'; again.textContent = '새로 바꾸기'; };
  again.addEventListener('click', () => {
    if (!G) return;
    if (foundN() > 0 && !G.done && again.dataset.armed !== '1'){
      again.dataset.armed = '1'; again.textContent = '한 번 더 누르면 바꿔요';
      clearTimeout(armT); armT = setTimeout(disarm, 2600);
      return;
    }
    clearTimeout(armT); disarm();
    if (G.art) buildArt(G.level);
    else newGame(G.base, G.level, G.sample, G.dataURL, G.illust ? 'illust' : undefined);
  });
  $('#doneAgain').addEventListener('click', () => { stopAuto(); newRound(); });
  $('#gear').addEventListener('click', () => { stopAuto(); syncStats(); $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => toast('이 기기에서는 전체 화면을 쓸 수 없어요.')); }
    } catch(e){ toast('이 기기에서는 전체 화면을 쓸 수 없어요.'); }
    $('#menu').hidden = true;
  });
  $('#doneClose').addEventListener('click', () => { stopAuto(); showDone = false; $('#done').hidden = true; });

  let last = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (G && G.started && !G.done && !document.hidden){ G.elapsed += now - last; syncStats(); }
    last = now;
  }, 500);
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    if (document.hidden) save(); else if (G && G.started) wake();
  });
  window.addEventListener('pagehide', save);
  new ResizeObserver(layout).observe(stage);

  boot();
  requestAnimationFrame(frame);
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
